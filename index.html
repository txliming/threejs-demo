<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FloorPlan 3D | Three.js户型可视化</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden}
canvas{display:block}
#tip{position:absolute;top:12px;left:12px;color:#fff;background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="tip">拖拽旋转 | 滚轮缩放 | 右键平移</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ========== 场景初始化 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(8,-14,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// 控制器
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ========== 户型数据（内嵌，不再读取外部json） ==========
const floorData = {
  wallHeight: 2.8,
  walls: [
    {points: [[0,0],[12,0],[12,10],[0,10],[0,0]], thickness:0.2},
    {points: [[6,0],[6,10]], thickness:0.2},
    {points: [[0,5],[6,5]], thickness:0.2}
  ],
  floor: {
    points: [[0,0],[12,0],[12,10]],
    color: 0xeeeeee
  }
};

// ========== 核心构建函数 buildFloorPlan ==========
function buildFloorPlan(data){
  const wallMat = new THREE.MeshStandardMaterial({color:0xf0ece0});
  const floorMat = new THREE.MeshStandardMaterial({color:data.floor.color});

  // 绘制地面
  const floorShape = new THREE.Shape();
  floorShape.moveTo(data.floor.points[0][0], data.floor.points[0][1]);
  for(let i=1;i<data.floor.points.length;i++){
    floorShape.lineTo(data.floor.points[i][0], data.floor.points[i][1]);
  }
  const floorGeo = new THREE.ShapeGeometry(floorShape);
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.rotation.x = -Math.PI / 2;
  scene.add(floorMesh);

  // 循环生成墙体
  data.walls.forEach(wall=>{
    const pts2d = wall.points;
    for(let i=0;i<pts2d.length-1;i++){
      const p1 = new THREE.Vector2(pts2d[i][0], pts2d[i][1]);
      const p2 = new THREE.Vector2(pts2d[i+1][0], pts2d[i+1][1]);
      const line = new THREE.LineCurve2D(p1,p2);
      const wallShape = new THREE.Shape();
      const offset = new THREE.Vector2(-(p2.y-p1.y), p2.x-p1.x).normalize().multiplyScalar(wall.thickness/2);
      wallShape.moveTo(p1.x + offset.x, p1.y + offset.y);
      wallShape.lineTo(p2.x + offset.x, p2.y + offset.y);
      const offset2 = new THREE.Vector2(p2.y-p1.y, -(p2.x-p1.x)).normalize().multiplyScalar(wall.thickness/2);
      wallShape.lineTo(p2.x + offset2.x, p2.y + offset2.y);
      wallShape.lineTo(p1.x + offset2.x, p1.y + offset2.y);
      wallShape.lineTo(p1.x + offset.x, p1.y + offset.y);

      const wallGeo = new THREE.ExtrudeGeometry(wallShape, {depth: data.wallHeight, bevelEnabled:false});
      const wallMesh = new THREE.Mesh(wallGeo, wallMat);
      wallMesh.rotation.x = -Math.PI/2;
      scene.add(wallMesh);
    }
  })
}

// 执行渲染户型
buildFloorPlan(floorData);

// 窗口自适应
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
})

// 渲染循环
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
