<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FloorPlan 3D | Three.js户型可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;}
canvas{display:block;}
#tip{position:absolute;top:10px;left:10px;color:#fff;font-family:system-ui;background:rgba(0,0,0,0.5);padding:8px;border-radius:6px;}
</style>
</head>
<body>
<div id="tip">🖱️拖拽旋转 | 滚轮缩放 | 右键平移</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
let scene,camera,renderer,controls;
let floorData;

// 初始化场景
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight,0.1,200);
  camera.position.set(8,-12,10);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // 轨道控制器
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 灯光
  const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
  dirLight.position.set(10,20,10);
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0xffffff,0.3));

  // 直接内嵌户型数据，不再读取外部json文件
const floorData = {
  "wallHeight": 2.8,
  "walls": [
    {"points": [[0,0],[12,0],[12,10],[0,10],[0,0]], "thickness":0.2},
    {"points": [[6,0],[6,10]], "thickness":0.2},
    {"points": [[0,5],[6,5]], "thickness":0.2}
  ],
  "floor": {
    "points": [[0,0],[12,0],[12,10],[0,10]],
    "color": 0xeeeeee
  }
};

/**
 * 实现户型图构建函数：解析并处理户型数据
 * @param {Object} data - 户型数据对象
 */
function buildFloorPlan(data) {
  // 基础数据解析（可根据实际需求扩展3D渲染/可视化逻辑）
  console.log("===== 户型数据解析成功 =====");
  console.log("墙体高度：", data.wallHeight, "m");
  console.log("墙体数量：", data.walls.length, "面");
  console.log("地面坐标：", data.floor.points);
  console.log("地面颜色：", data.floor.color);
  
  // 遍历打印每面墙体信息
  data.walls.forEach((wall, index) => {
    console.log(`第${index+1}面墙 - 厚度：${wall.thickness}m，坐标点：`, wall.points);
  });
  console.log("==========================");
}

// 调用户型图构建函数（函数已定义，可正常执行）
buildFloorPlan(floorData);


  window.addEventListener('resize',onWindowResize);
  animate();
}

// 构建户型：拉伸墙体
function buildFloorPlan(data){
  const wallMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.8});
  const floorMat = new THREE.MeshStandardMaterial({color:data.floor.color, roughness:0.9});

  // 绘制地板
  const floorShape = new THREE.Shape();
  const fp = data.floor.points;
  floorShape.moveTo(fp[0][0], fp[0][1]);
  for(let i=1;i<fp.length;i++) floorShape.lineTo(fp[i][0], fp[i][1]);
  const floorGeo = new THREE.ShapeGeometry(floorShape);
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.rotation.x = -Math.PI/2;
  scene.add(floorMesh);

  // 批量生成墙体
  data.walls.forEach(wall=>{
    const pts = wall.points;
    for(let i=0;i<pts.length-1;i++){
      const p1 = new THREE.Vector2(pts[i][0], pts[i][1]);
      const p2 = new THREE.Vector2(pts[i+1][0], pts[i+1][1]);
      const wallGeo = createWallGeo(p1,p2,wall.thickness, data.wallHeight);
      const wallMesh = new THREE.Mesh(wallGeo, wallMat);
      scene.add(wallMesh);
    }
  })
}

// 生成单段墙体几何体
function createWallGeo(p1,p2,thick,height){
  const vec = p2.clone().sub(p1);
  const len = vec.length();
  const geo = new THREE.BoxGeometry(len, height, thick);
  const mid = p1.clone().add(p2).multiplyScalar(0.5);
  geo.translate(0, height/2, 0);
  geo.rotateY(Math.atan2(vec.y, vec.x));
  geo.translate(mid.x,0,mid.y);
  return geo;
}

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
function onWindowResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
