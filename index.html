<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FloorPlan 3D | Three.js户型可视化</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden}
canvas{display:block}
#tip{position:absolute;top:12px;left:12px;color:#fff;background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="tip">拖拽旋转 | 滚轮缩放 | 右键平移</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ========== 场景初始化 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(6,-12,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// 控制器
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ========== 户型数据 ==========
const floorData = {
  wallHeight: 2.8,
  walls: [
    { start:[0,0], end:[12,0], thickness:0.2 },
    { start:[12,0], end:[12,10], thickness:0.2 },
    { start:[12,10], end:[0,10], thickness:0.2 },
    { start:[0,10], end:[0,0], thickness:0.2 },
    { start:[6,0], end:[6,10], thickness:0.2 },
    { start:[0,5], end:[6,5], thickness:0.2 }
  ],
  floor: {
    x:0, y:0, w:12, h:10, color:0xeeeeee
  }
};

// ========== 构建户型（用Box墙体，稳定无bug） ==========
function buildFloorPlan(data){
  const wallMat = new THREE.MeshStandardMaterial({color:0xf0ece0});
  const floorMat = new THREE.MeshStandardMaterial({color:data.floor.color});

  // 地面
  const floorGeo = new THREE.PlaneGeometry(data.floor.w, data.floor.h);
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.set(data.floor.w/2,0,data.floor.h/2);
  scene.add(floorMesh);

  // 墙体，每一段墙用Box
  data.walls.forEach(wall=>{
    const sx = wall.start[0], sz = wall.start[1];
    const ex = wall.end[0], ez = wall.end[1];
    const dx = ex - sx;
    const dz = ez - sz;
    const len = Math.sqrt(dx*dx + dz*dz);
    const wallGeo = new THREE.BoxGeometry(len, data.wallHeight, wall.thickness);
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.set((sx+ex)/2, data.wallHeight/2, (sz+ez)/2);
    wallMesh.rotation.y = Math.atan2(dz, dx);
    scene.add(wallMesh);
  })
}

buildFloorPlan(floorData);

// 窗口自适应
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
})

// 渲染循环
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
